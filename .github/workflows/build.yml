name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest 
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version
          uname -m

      # On release tags, stamp the app version (v1.2.3 -> 1.2.3) into Info.plist.
      - name: Set app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" Resources/App/Info.plist

      # Stable self-signed identity (see scripts/create-signing-cert.sh). It keeps the
      # code identity the same across releases so macOS keeps the Accessibility grant
      # after an update. Without the secrets the build falls back to ad-hoc signing.
      - name: Import signing certificate
        env:
          SIGN_CERT_P12: ${{ secrets.FLYBY_SIGN_CERT_P12 }}
          SIGN_CERT_PASSWORD: ${{ secrets.FLYBY_SIGN_CERT_PASSWORD }}
        run: |
          if [[ -z "$SIGN_CERT_P12" ]]; then
            echo "::warning::FLYBY_SIGN_CERT_P12 not set; ad-hoc signing (permissions reset on every update)"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/flyby-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$SIGN_CERT_P12" | base64 --decode > "$RUNNER_TEMP/flyby-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/flyby-signing.p12" -k "$KEYCHAIN" -P "$SIGN_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/flyby-signing.p12"

      # Not Developer ID / notarized: on first launch users must right-click > Open once
      # or remove the quarantine attribute.
      - name: Package app
        run: ./scripts/package-app.sh

      # dmgbuild writes the Finder window layout directly (no Finder scripting), so it works headless.
      - name: Install dmgbuild
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet dmgbuild
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Create DMG installer
        run: ./scripts/make-dmg.sh

      - name: Zip app and compute checksums
        run: |
          mv dist/Flyby-macos-arm64.dmg .
          ditto -c -k --keepParent dist/Flyby.app Flyby-macos-arm64.zip
          shasum -a 256 Flyby-macos-arm64.dmg Flyby-macos-arm64.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flyby-macos-arm64
          path: |
            Flyby-macos-arm64.dmg
            Flyby-macos-arm64.zip
            SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Flyby-macos-arm64

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Flyby-macos-arm64.dmg Flyby-macos-arm64.zip SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
