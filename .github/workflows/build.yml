name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest 
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version
          uname -m

      # users must right-click > Open once or remove the quarantine attribute.
      - name: Package app
        run: ./scripts/package-app.sh

      - name: Zip app and compute checksum
        run: |
          ditto -c -k --keepParent dist/Flyby.app Flyby-macos-arm64.zip
          shasum -a 256 Flyby-macos-arm64.zip > Flyby-macos-arm64.zip.sha256
          cat Flyby-macos-arm64.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flyby-macos-arm64
          path: |
            Flyby-macos-arm64.zip
            Flyby-macos-arm64.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Flyby-macos-arm64

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Flyby-macos-arm64.zip Flyby-macos-arm64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
