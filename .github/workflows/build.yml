name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest 
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version
          uname -m

      # On release tags, stamp the app version (v1.2.3 -> 1.2.3) into Info.plist.
      - name: Set app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" Resources/App/Info.plist

      # The app is ad-hoc signed (not Developer ID / notarized): on first launch users
      # must right-click > Open once or remove the quarantine attribute.
      - name: Package app
        run: ./scripts/package-app.sh

      - name: Create DMG installer
        run: ./scripts/make-dmg.sh

      - name: Zip app and compute checksums
        run: |
          mv dist/Flyby-macos-arm64.dmg .
          ditto -c -k --keepParent dist/Flyby.app Flyby-macos-arm64.zip
          shasum -a 256 Flyby-macos-arm64.dmg Flyby-macos-arm64.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flyby-macos-arm64
          path: |
            Flyby-macos-arm64.dmg
            Flyby-macos-arm64.zip
            SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Flyby-macos-arm64

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Flyby-macos-arm64.dmg Flyby-macos-arm64.zip SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
